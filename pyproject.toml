[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "llm-hallucination-checker-edge"
version = "0.1.0"
description = "A lightweight OTEL GenAI trace parser to catch prompt drift and hallucination risks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "opentelemetry",
    "otel",
    "genai",
    "llm",
    "hallucination",
    "observability",
    "prompt-drift",
    "ai-safety",
]
authors = [
    { name = "Steven Keefe", email = "keefe@keefebuild.dev" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/CallmeKeefe/llm-hallucination-checker-edge"
Repository = "https://github.com/CallmeKeefe/llm-hallucination-checker-edge"
Issues = "https://github.com/CallmeKeefe/llm-hallucination-checker-edge/issues"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.hatch.build.targets.sdist]
include = [
    "/core",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
