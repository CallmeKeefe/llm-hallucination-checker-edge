[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "llm-hallucination-checker-edge"
version = "0.1.0"
description = "A lightweight OTEL GenAI trace parser to catch prompt drift and hallucination risks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "opentelemetry",
    "otel",
    "genai",
    "llm",
    "hallucination",
    "observability",
    "prompt-drift",
    "ai-safety",
]
authors = [
    { name = "Steven Keefe", email = "keefe@keefebuild.dev" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/CallmeKeefe/llm-hallucination-checker-edge"
Repository = "https://github.com/CallmeKeefe/llm-hallucination-checker-edge"
Issues = "https://github.com/CallmeKeefe/llm-hallucination-checker-edge/issues"

[project.scripts]
llm-hallucination-checker = "core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.hatch.build.targets.sdist]
include = [
    "/core",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

# Lint and format. The rule set is ruff's default (E4, E7, E9, F) plus two that
# matter here: I001 keeps imports sorted, and UP keeps the code on the syntax the
# stated floor of 3.10 supports. Deliberately not `select = ["ALL"]`: a rule set
# that has to be argued down one exception at a time is worse than a small set
# everyone can keep green.
[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
